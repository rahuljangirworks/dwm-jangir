[Greeter]
# The Solar greeter paints its own Cairo line-and-grain backdrop.  No image
# background is selected or installed for this theme.
background=
background-color=#0B0F14
stretch-background-across-monitors=false
draw-grid=false
draw-user-backgrounds=false
logo=

# The patched UI supplies the local clock, optional weather, sun timeline, and
# session controls, so hide overlapping stock Slick Greeter elements.
content-align=center
theme-name=dwm-jangir-dark
icon-theme-name=Adwaita
font-name=Cantarell 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
xft-dpi=96
show-clock=false
show-hostname=true
show-power=false
show-a11y=false
show-keyboard=false
show-quit=true
enable-hidpi=auto
activate-numlock=false
