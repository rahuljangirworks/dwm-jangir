[Greeter]
# The wrapper chooses one bundled wallpaper before the greeter starts. Only
# that image is decoded for a login screen; the greeter never downloads data.
background=/run/lightdm/dwm-jangir-background
background-color=#0B0F14
stretch-background-across-monitors=false
draw-grid=false
draw-user-backgrounds=false

# The patched greeter supplies its own compact visual identity.
logo=
content-align=center
theme-name=dwm-jangir-dark
icon-theme-name=Adwaita

# Cantarell is shipped by Fedora and remains legible at every supported DPI.
font-name=Cantarell 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
xft-dpi=96

# Minimal panel: hostname on the left and one power menu on the right. The
# large clock is rendered above the login card.
show-clock=false
clock-format=%I:%M %p
show-hostname=true
show-power=false
show-a11y=false
show-keyboard=false
show-quit=true

enable-hidpi=auto
activate-numlock=false
